[package]
name = "reconform-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded executable capture and observation comparisons with reproducible reports"
readme = "README.md"
keywords = ["testing", "verification", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "reconform"
path = "src/main.rs"

[dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags", "process-group"] }
ctrlc = { version = "3.5", features = ["termination"] }
png = { version = "0.18.1", optional = true }
renderparity = { path = "../renderparity", version = "0.1.0" }
reconform-core = { path = "../reconform-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
png = ["dep:png"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
