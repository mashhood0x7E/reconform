[package]
name = "reconform-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline verification of recorded observations with reproducible reports"
readme = "README.md"
keywords = ["testing", "verification", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "reconform"
path = "src/main.rs"

[dependencies]
reconform-core = { path = "../reconform-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
