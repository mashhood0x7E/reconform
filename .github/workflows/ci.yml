name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Validate wire schemas independently
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-schemas.ps1
      - run: cargo test -p reconform-core --no-default-features --locked
      - run: cargo test -p renderparity --no-default-features --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo run --manifest-path examples/core-consumer/Cargo.toml --release --locked
      - run: cargo run --manifest-path examples/frame-consumer/Cargo.toml --release --locked
      - run: cargo tree --manifest-path examples/core-consumer/Cargo.toml -e normal,build --locked
      - run: cargo tree --manifest-path examples/frame-consumer/Cargo.toml -e normal,build --locked
      - run: cargo package --workspace --locked
